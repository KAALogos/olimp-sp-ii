async function open(pw){
 var k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(P.salt),iterations:P.it,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
 var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(P.iv)},k,d(P.ct));
 return new TextDecoder().decode(pt)}
